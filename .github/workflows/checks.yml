name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    # Checks the form of the Markdown files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: |
            **/*.md
            !.claude/skills/**
            !docs/setup-guide.md

  links:
    # Catches pointers in CLAUDE.md and the docs that point to a missing file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --no-progress
            --exclude-path '\.claude/skills'
            --exclude-path 'docs/setup-guide\.md'
            './**/*.md'

  skills:
    # Fails if a copied skill was edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sha256sum -c .claude/skills/CHECKSUMS

  test:
    # Runs the tests: whole nightly runs against saved Publisher answers and
    # a local test database (Supabase's own, started in Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0
      - name: Check types and style
        run: |
          deno check supabase/functions/
          deno lint supabase/functions/
          deno fmt --check supabase/functions/
      - name: Start the test database
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run the tests
        run: scripts/test.sh
