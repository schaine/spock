name: diagnose-publish

# Temporary, read-only: finds why the publish checks cannot log in to the
# database. Changes nothing in Supabase. Removed before the fix is merged.
on:
  push:
    branches: [claude/eloquent-keller-ljn9xa]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bzvsfjrthsyepiurmmno
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Show the saved pooler address (it holds no password)
        run: sed -E 's#://([^:@/]+):[^@]*@#://\1:REDACTED@#' supabase/.temp/pooler-url; echo
      - name: Password length and edges (not the password)
        run: |
          echo "length: ${#SUPABASE_DB_PASSWORD}"
          case "$SUPABASE_DB_PASSWORD" in *[[:space:]]*) echo "contains whitespace";; *) echo "no whitespace";; esac
      - name: Does the CLI itself log in? (dry run, changes nothing)
        if: always()
        run: supabase db push --remote --dry-run 2>&1 | tail -25
      - name: Does psql log in, as the publish checks do?
        if: always()
        run: |
          url=$(cat supabase/.temp/pooler-url)
          host=$(echo "$url" | sed -E 's#^[^@]*@([^:/]+).*#\1#')
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "host=$host port=5432 dbname=postgres user=postgres.$PROJECT_REF sslmode=require" -c 'select 1 as logged_in' || true
