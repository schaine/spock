name: publish

# Publishes Spock to its Supabase project after every merge into main:
# applies the new migrations, then publishes the Edge Functions. Can also be
# started by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges close together publish one after the other, never at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The Spock project, in Ireland (eu-west-1). Not a secret.
      PROJECT_REF: bzvsfjrthsyepiurmmno
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3
        with:
          # Keep the same version as the test job in checks.yml.
          version: 3.3.0
      - name: Link to the Spock project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Check the project before the first publish
        run: scripts/publish-check.sh scripts/publish_checks/before_first_publish.sql
      - name: Apply the new migrations
        run: supabase db push --remote --yes
      - name: Publish the Edge Functions
        run: supabase functions deploy --use-api --yes
      - name: Check what was published
        run: scripts/publish-check.sh scripts/publish_checks/after_publish.sql
      - name: Check that collect refuses calls without the secret key
        run: |
          # A function just published can take a few seconds to answer.
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              "https://$PROJECT_REF.supabase.co/functions/v1/collect" || true)
            if [ "$status" = 401 ]; then exit 0; fi
            echo "Attempt $attempt: collect answered $status."
            sleep 10
          done
          echo "::error::collect answered $status without the secret key; expected 401."
          exit 1
