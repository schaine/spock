<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPOCK — Stacked lockup · Black  (mobile / compact use)
  Symbol centred above wordmark. Good for splash screens, mobile nav, app store.
  Wordmark: Helvetica Neue Light (weight 300), letter-spacing 10.
  Canvas: 320 × 260 (1.23:1)
  Note: S mark's full arc spans y≈13–244 in the 256-unit viewbox;
  scale 0.60 fits that range (14→158 in canvas) with safe margins.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img">
  <title>Spock</title>

  <!--
    Symbol at 60% scale, horizontally centred.
    tx = (320 - 256×0.6) / 2 = 83.2 ≈ 83
    ty = 12 → arc top (y=13 in source) lands at 13×0.6+12 = 19.8 ≈ 20 ✓
           → arc bottom (y=244) lands at 244×0.6+12 = 158.4 ✓
  -->
  <g transform="translate(83,12) scale(0.60)">
    <path d="M 196,89 A 68,68 0 0 0 60,89 L 196,168 A 68,68 0 0 1 60,168"
          fill="none"
          stroke="#000000"
          stroke-width="16"
          stroke-linecap="butt"
          stroke-linejoin="round"/>
    <polygon points="188,89 204,89 196,65" fill="#000000"/>
    <polygon points="52,168 68,168 60,144" fill="#000000"/>
  </g>

  <!-- Wordmark centred below symbol (gap from S bottom ~24px) -->
  <text x="160" y="210"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="38"
        font-weight="300"
        letter-spacing="10"
        text-anchor="middle"
        fill="#000000">SPOCK</text>

</svg>
