<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPOCK — Horizontal lockup · Black  (desktop / header)
  Wordmark uses Helvetica Neue Light (weight 300), letter-spacing 14.
  In Figma: set the text layer font to Helvetica Neue, weight Light (300).
  For stroke-less paths: select the S path, Object → Outline Stroke.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" role="img">
  <title>Spock</title>

  <!--
    Symbol: 65% scale, visual content centred vertically in 160px canvas.
    Visual content bounds in source: (52,65)–(204,176).
    At scale 0.65, translate(-14,2): top→44px, bottom→116px, centre→80px ✓
  -->
  <g transform="translate(-14,2) scale(0.65)">
    <path d="M 196,89 A 68,68 0 0 0 60,89 L 196,168 A 68,68 0 0 1 60,168"
          fill="none"
          stroke="#000000"
          stroke-width="16"
          stroke-linecap="butt"
          stroke-linejoin="round"/>
    <polygon points="188,89 204,89 196,65" fill="#000000"/>
    <polygon points="52,168 68,168 60,144" fill="#000000"/>
  </g>

  <!-- Thin separator -->
  <line x1="142" y1="30" x2="142" y2="130"
        stroke="#000000" stroke-width="1" opacity="0.22"/>

  <!-- Wordmark — Helvetica Neue Light (300), letter-spacing 14 -->
  <text x="160" y="80"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="300"
        letter-spacing="14"
        dominant-baseline="middle"
        fill="#000000">SPOCK</text>

</svg>
