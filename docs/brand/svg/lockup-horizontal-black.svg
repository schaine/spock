<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPOCK — Horizontal lockup · Black  (desktop / header)
  Wordmark: Newsreader SemiBold (weight 600), letter-spacing −2% = −1.04px at 52px.
  In Figma: set the text layer font to Newsreader, weight SemiBold (600), letter-spacing −2%.
  For stroke-less paths: select the S path, Object → Outline Stroke.
  Colour: #0C0D0D (design system token "black")
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" role="img">
  <title>Spock</title>

  <!--
    Symbol: 65% scale, visual content centred vertically in 160px canvas.
    Visual content bounds in source: (52,65)–(204,176).
    At scale 0.65, translate(-14,2): top→44px, bottom→116px, centre→80px ✓
  -->
  <g transform="translate(-14,2) scale(0.65)">
    <path d="M 196,89 A 68,68 0 0 0 60,89 L 196,168 A 68,68 0 0 1 60,168"
          fill="none"
          stroke="#0C0D0D"
          stroke-width="16"
          stroke-linecap="butt"
          stroke-linejoin="round"/>
    <polygon points="188,89 204,89 196,65" fill="#0C0D0D"/>
    <polygon points="52,168 68,168 60,144" fill="#0C0D0D"/>
  </g>

  <!-- Thin separator -->
  <line x1="142" y1="30" x2="142" y2="130"
        stroke="#0C0D0D" stroke-width="1" opacity="0.22"/>

  <!-- Wordmark — Newsreader SemiBold (600), −2% letter-spacing = −1.04px at 52px -->
  <text x="160" y="80"
        font-family="'Newsreader', Georgia, 'Times New Roman', serif"
        font-size="52"
        font-weight="600"
        letter-spacing="-1.04"
        dominant-baseline="middle"
        fill="#0C0D0D">SPOCK</text>

</svg>
