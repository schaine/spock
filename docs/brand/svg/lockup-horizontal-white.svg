<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPOCK — Horizontal lockup · White  (desktop / header on dark backgrounds)
  Wordmark: Newsreader SemiBold (weight 600), letter-spacing −2% = −1.04px at 52px.
  In Figma: set the text layer font to Newsreader, weight SemiBold (600), letter-spacing −2%.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" role="img">
  <title>Spock</title>

  <g transform="translate(-14,2) scale(0.65)">
    <path d="M 196,89 A 68,68 0 0 0 60,89 L 196,168 A 68,68 0 0 1 60,168"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="16"
          stroke-linecap="butt"
          stroke-linejoin="round"/>
    <polygon points="188,89 204,89 196,65" fill="#FFFFFF"/>
    <polygon points="52,168 68,168 60,144" fill="#FFFFFF"/>
  </g>

  <line x1="142" y1="30" x2="142" y2="130"
        stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>

  <!-- Wordmark — Newsreader SemiBold (600), −2% letter-spacing = −1.04px at 52px -->
  <text x="160" y="80"
        font-family="'Newsreader', Georgia, 'Times New Roman', serif"
        font-size="52"
        font-weight="600"
        letter-spacing="-1.04"
        dominant-baseline="middle"
        fill="#FFFFFF">SPOCK</text>

</svg>
